name: CI

on:
  push:
    branches: [main, 'issue-*', 'feat/*', 'feature/*', 'fix/*']
  pull_request:
    branches: [main]

jobs:
  shell-tests:
    name: Shell / Installer Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats

      - name: Syntax check agent-install.sh
        run: bash -n agent-install.sh

      - name: ShellCheck agent-install.sh
        run: shellcheck agent-install.sh

      - name: Run installer BATS tests
        # Derivation: #579 extracted agent_chat to a peer repo and replaced the
        # legacy test_agent_chat_installer.bats suite with the focused peer
        # detection coverage in test_agent_chat_peer_detection.bats. This
        # workflow invocation is updated to match the renamed test file.
        run: bats tests/install/test_agent_chat_peer_detection.bats tests/install/test_agents_json_safety.bats tests/install/test_plan_reorder_exit_codes.bats
